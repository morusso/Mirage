[project]
name = "mirage"
version = "0.0.0"
description = "Adaptive AI-driven honeypot API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "workers", "domain", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "ASYNC",
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Legacy PyCharm scaffold, removed when app/main.py lands.
exclude = ["^main\\.py$"]
