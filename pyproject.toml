[project]
name = "mirage"
version = "0.1.0"
description = "Adaptive AI-driven honeypot API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "dnspython>=2.7.0",
    "fastapi>=0.162.0",
    "httptools>=0.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "maxminddb>=3.2.0",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "testcontainers[postgres,redis]>=4.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "ASYNC",
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true
