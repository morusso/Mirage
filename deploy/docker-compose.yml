# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: mirage

# Applied to every service. Only caddy adds back the one capability it needs.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

x-app: &app
  <<: *hardened
  build:
    context: ..
    dockerfile: Dockerfile
  image: mirage:dev
  restart: unless-stopped
  environment: &app-env
    MIRAGE_ENVIRONMENT: ${MIRAGE_ENVIRONMENT:-prod}
    MIRAGE_LOG_LEVEL: ${MIRAGE_LOG_LEVEL:-INFO}
    MIRAGE_REDIS_URL: redis://redis:6379/0
    # Only the reverse proxy (edge network) may set X-Forwarded-For.
    MIRAGE_TRUSTED_PROXIES: '["172.28.0.0/24"]'
    MIRAGE_DATABASE_URL: postgresql+asyncpg://mirage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mirage
  networks: [backend]

services:
  redis:
    <<: *hardened
    image: redis:7-alpine
    restart: unless-stopped
    # Started as the redis user: the stock entrypoint would otherwise need
    # CHOWN/SETUID/SETGID to drop privileges, which cap_drop removes.
    user: redis
    # AOF keeps queued events across a Redis restart (goal: no event loss).
    # noeviction + maxmemory: when the stream outgrows memory, XADD fails (the app
    # logs and drops that event) instead of the kernel OOM-killing Redis.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 1280M, pids: 256}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  postgres:
    <<: *hardened
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # Same reason as redis: run as postgres from the start, no gosu step.
    user: postgres
    tmpfs:
      - /tmp
      - /var/run/postgresql
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 2G, pids: 256}
    environment:
      POSTGRES_USER: mirage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mirage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirage -d mirage"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  caddy:
    <<: *hardened
    image: caddy:2-alpine
    restart: unless-stopped
    # Binds 80/443 and writes its own root-owned /data, so it stays root but with
    # nothing except this capability.
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 256}
    environment:
      MIRAGE_DOMAIN: ${MIRAGE_DOMAIN:?set MIRAGE_DOMAIN}
    ports:
      - "${MIRAGE_HTTP_PORT:-80}:80"
      - "${MIRAGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: losing this means re-issuing (rate limits).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      edge:
        # Fixed address: the nftables egress rules single caddy out by it.
        ipv4_address: 172.28.0.2

  # One-shot: applies Alembic migrations, then exits. Everything that touches the
  # database waits for it.
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 256}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    environment:
      <<: *app-env
      # The internal server (health, metrics) listens inside the container only; its port is
      # never published.
      MIRAGE_INTERNAL_HOST: 0.0.0.0
    # monitoring: so Prometheus can scrape the internal server.
    networks: [backend, edge, monitoring]
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 768M, pids: 256}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  persister:
    <<: *app
    command: ["python", "-m", "workers.persister"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 384M, pids: 256}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Metrics storage. Reachable only from the monitoring network, never published;
  # access for operators comes with the VPN.
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever limit is hit first; keeps a small VPS disk from filling up.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M, pids: 256}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [monitoring]

  # Dashboards. Same exposure as Prometheus: internal network only, no published port.
  grafana:
    <<: *hardened
    image: grafana/grafana-oss:12.0.2
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M, pids: 256}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No phone-home (the egress firewall would block it anyway) and no log files:
      # the filesystem is read-only.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [monitoring]

networks:
  # Databases and workers; nothing here is reachable from outside. Fixed subnet
  # because deploy/firewall/nftables.conf lists it.
  backend:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # Reverse proxy <-> app. Fixed subnet so the app can name its trusted proxy range.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Automatic addresses come from the upper half, so they can never take
          # caddy's fixed 172.28.0.2 (which they otherwise would: app starts first).
          ip_range: 172.28.0.128/25

  # Prometheus and Grafana. `internal` means no route out: neither can reach the
  # internet or the backend network. Fixed subnet because nftables.conf lists it.
  monitoring:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
