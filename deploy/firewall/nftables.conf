#!/usr/sbin/nft -f
#
# Egress whitelist for the Mirage VPS. The honeypot is attacked on purpose, so a
# compromised container must not be able to reach anything but what it needs.
# (Ingress is not filtered here; Docker publishes only caddy's 80/443.)
#
# Two layers:
#   forward - traffic from Docker networks: containers talk to each other; only
#             caddy may leave (DNS + HTTPS for ACME/OCSP), and the enrichment worker
#             (DNS + HTTPS to @allowed_https_v4). app and the other workers may not.
#   output  - the host itself: DNS, NTP, DHCP and HTTPS to the hosts in
#             @allowed_https_v4 (enrichment APIs, LLM API, log server).
#
# Docker subnets and caddy's address must match deploy/docker-compose.yml.
# Load:   nft -f deploy/firewall/nftables.conf
# Fill the HTTPS allow-list:   deploy/firewall/update-egress-set.sh

# Declare-then-delete makes reloading idempotent (works even on first load).
table inet mirage_egress
delete table inet mirage_egress

table inet mirage_egress {
	# Filled from egress-hosts.txt by update-egress-set.sh; empty means "no HTTPS".
	set allowed_https_v4 {
		type ipv4_addr
		flags interval
	}

	set docker_subnets {
		type ipv4_addr
		flags interval
		elements = { 172.28.0.0/24, 172.29.0.0/24, 172.30.0.0/24, 172.31.0.0/24, 172.32.0.0/24 }
	}

	chain forward {
		type filter hook forward priority filter; policy accept;

		ct state established,related accept

		# Container <-> container (app -> redis/postgres, caddy -> app).
		ip saddr @docker_subnets ip daddr @docker_subnets accept

		# caddy only: name resolution and HTTPS (Let's Encrypt, OCSP stapling).
		ip saddr 172.28.0.2 udp dport 53 accept
		ip saddr 172.28.0.2 tcp dport { 53, 443 } accept

		# enrichment worker only: name resolution (reverse DNS, API host names) and HTTPS to
		# the allow-listed hosts (AbuseIPDB). Same list as the host, filled by update-egress-set.sh.
		ip saddr 172.29.0.10 udp dport 53 accept
		ip saddr 172.29.0.10 tcp dport 53 accept
		ip saddr 172.29.0.10 ip daddr @allowed_https_v4 tcp dport 443 accept

		# Everything else that originates in a container network is dropped. Replies to
		# inbound connections are covered by the conntrack rule above.
		ip saddr @docker_subnets limit rate 5/minute log prefix "mirage-egress-drop: "
		ip saddr @docker_subnets counter drop
	}

	chain output {
		type filter hook output priority filter; policy drop;

		oifname "lo" accept
		ct state established,related accept

		# Docker bridges (host -> published ports, health probes).
		oifname "br-*" accept
		oifname "docker0" accept

		# Name resolution, time, DHCP.
		udp dport { 53, 123 } accept
		tcp dport 53 accept
		udp sport 68 udp dport 67 accept

		# IPv6 housekeeping only; no IPv6 egress otherwise.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, echo-reply } accept
		icmp type echo-reply accept

		ip daddr @allowed_https_v4 tcp dport 443 accept

		limit rate 5/minute log prefix "mirage-host-egress-drop: "
	}
}
