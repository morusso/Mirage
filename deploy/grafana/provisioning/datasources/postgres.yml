apiVersion: 1

datasources:
  - name: Mirage Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    editable: false
    jsonData:
      database: mirage
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      # Expanded from the container environment (GRAFANA_DB_PASSWORD).
      password: $GRAFANA_DB_PASSWORD
