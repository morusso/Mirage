<!DOCTYPE html>
	<html lang="en-US">
	<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Log In &lsaquo; ShopNest &#8212; WordPress</title>
	<link rel='stylesheet' id='login-css' href='/wp-admin/css/login.min.css?ver=6.4.3' media='all' />
	<meta name='robots' content='noindex, noarchive' />
	<meta name="viewport" content="width=device-width" />
	</head>
	<body class="login no-js login-action-login wp-core-ui  locale-en-us">
	<div id="login">
		<h1><a href="https://wordpress.org/">Powered by WordPress</a></h1>
{% if error %}
	<div id="login_error">{{ error }}<br />
</div>
{% endif %}
	<form name="loginform" id="loginform" action="/wp-login.php" method="post">
		<p>
			<label for="user_login">Username or Email Address</label>
			<input type="text" name="log" id="user_login" class="input" value="{{ username }}" size="20" autocapitalize="off" autocomplete="username" required="required" />
		</p>
		<div class="user-pass-wrap">
			<label for="user_pass">Password</label>
			<div class="wp-pwd">
				<input type="password" name="pwd" id="user_pass" class="input password-input" value="" size="20" autocomplete="current-password" spellcheck="false" required="required" />
			</div>
		</div>
		<p class="forgetmenot"><input name="rememberme" type="checkbox" id="rememberme" value="forever" /> <label for="rememberme">Remember Me</label></p>
		<p class="submit">
			<input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In" />
			<input type="hidden" name="redirect_to" value="/wp-admin/" />
			<input type="hidden" name="testcookie" value="1" />
		</p>
	</form>
	<p id="nav">
		<a class="wp-login-lost-password" href="/wp-login.php?action=lostpassword">Lost your password?</a>
	</p>
	<p id="backtoblog"><a href="/">&larr; Go to ShopNest</a></p>
	</div>
	</body>
	</html>
